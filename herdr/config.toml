onboarding = false

[keys]
prefix = "backtick"
previous_tab = ""
next_tab = ""
previous_agent = "prefix+p"
next_agent = "prefix+n"
previous_workspace = "prefix+shift+left"
next_workspace = "prefix+shift+right"
switch_workspace = "prefix+shift+1..9"
split_horizontal = "prefix+minus"
split_vertical = "prefix+|"

[[keys.command]]
key = "prefix+k"
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"

[ui]
status_indicators = "dots"
sidebar_width = 31
sidebar_min_width = 22
sidebar_max_width = 43

[ui.sidebar.agents]
row_gap = 0
rows = [["state_icon"], ["workspace", "pane"]]

[ui.sound]
enabled = false

[ui.toast]
delivery = "system"

[theme]
name = "gruvbox"
auto_switch = false
